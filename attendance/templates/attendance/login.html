{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AttendEase</title>

    <link rel="stylesheet"
          href="{% static 'attendance/css/style.css' %}">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- University Logo -->
            <img
                src="{% static 'attendance/images/university-logo.png' %}"
                alt="University Logo"
                class="login-logo"
            >

            <h1>AttendEase</h1>

            <p class="login-subtitle">
                Attendance Management System
            </p>


            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                {% if error %}
                    <p class="login-error">
                        {{ error }}
                    </p>
                {% endif %}


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
