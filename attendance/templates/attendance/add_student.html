{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student | AttendEase</title>

    <link rel="stylesheet"
          href="{% static 'attendance/css/style.css' %}">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="brand">

            <img
                src="{% static 'attendance/images/university-logo.png' %}"
                alt="University Logo"
                class="logo"
            >

            <div class="brand-text">
                <h1>AttendEase</h1>
                <span>Attendance Management System</span>
            </div>

        </div>

        <a href="{% url 'student_list' %}" class="login-button">
            Back to Students
        </a>

    </header>


    <!-- Add Student Section -->
    <main>

        <section class="features">

            <div class="section-heading">

                <span>STUDENT MANAGEMENT</span>

                <h2>
                    Add Student
                </h2>

                <p>
                    Enter the student's information below.
                </p>

            </div>


            <div class="student-form-container">

                <form method="POST" class="student-form">

                    {% csrf_token %}


                    <!-- Student Name -->
                    <div class="form-group">

                        <label for="name">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter student name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter student email"
                            required
                        >

                    </div>


                    <!-- Roll Number -->
                    <div class="form-group">

                        <label for="roll_number">
                            Roll / Registration Number
                        </label>

                        <input
                            type="text"
                            id="roll_number"
                            name="roll_number"
                            placeholder="Enter roll or registration number"
                            required
                        >

                    </div>


                    <!-- Branch -->
                    <div class="form-group">

                        <label for="branch">
                            Branch
                        </label>

                        <input
                            type="text"
                            id="branch"
                            name="branch"
                            value="CSE"
                            readonly
                        >

                    </div>


                    <!-- Semester -->
                    <div class="form-group">

                        <label for="semester">
                            Semester
                        </label>

                        <input
                            type="text"
                            id="semester"
                            name="semester"
                            value="5"
                            readonly
                        >

                    </div>


                    <button
                        type="submit"
                        class="login-submit"
                    >
                        Add Student
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 AttendEase · Attendance Management System
        </p>

    </footer>

</body>
</html>
